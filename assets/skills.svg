<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560">
  <defs>
    <style>
      @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      @keyframes iconPop{0%{transform:scale(0.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
      @keyframes iconHover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .f0{animation:fadeUp .5s 0s both}
      .f1{animation:fadeUp .5s .1s both}
      .f2{animation:fadeUp .5s .2s both}
      .f3{animation:fadeUp .5s .3s both}
      .f4{animation:fadeUp .5s .4s both}
      .f5{animation:fadeUp .5s .5s both}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <pattern id="bg-dots" patternUnits="userSpaceOnUse" width="24" height="24">
      <circle cx="12" cy="12" r="1.1" fill="#247bff" opacity=".055"/>
    </pattern>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#0c1525"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#247bff" stop-opacity=".8"/>
      <stop offset="50%"  stop-color="#ff354f" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity=".2"/>
    </linearGradient>
    <!-- icon pill shape -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>

  <!-- Background -->
